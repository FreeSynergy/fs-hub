[package]
name = "fs-hub-e2e"
description = "Test crate: the hub daemon with real program servers (people, tasks, calendar). Nothing here ships; it exists so that the hub itself depends on no program"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
fs-hub = { path = "../fs-hub" }
fs-hub-client = { path = "../fs-hub-client" }
fs-objects.workspace = true
fs-interfaces.workspace = true
tokio = { version = "1", features = ["full"] }
serde_json.workspace = true
tempfile = "3"
capnp.workspace = true
capnp-rpc.workspace = true
uuid = "1"
chrono.workspace = true

[dev-dependencies]
fs-people-core = { git = "https://github.com/FreeSynergy/fs-people", tag = "v0.5.0" }
fs-people-server = { git = "https://github.com/FreeSynergy/fs-people", tag = "v0.5.0" }
fs-tasks-core = { git = "https://github.com/FreeSynergy/fs-tasks", tag = "v0.7.0", features = ["contract"] }
fs-tasks-server = { git = "https://github.com/FreeSynergy/fs-tasks", tag = "v0.7.0" }
fs-calendar-core = { git = "https://github.com/FreeSynergy/fs-calendar", tag = "v0.6.0", features = ["contract"] }
fs-calendar-server = { git = "https://github.com/FreeSynergy/fs-calendar", tag = "v0.6.0" }
