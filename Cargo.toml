[workspace]
resolver = "2"
members = ["crates/fs-hub-proto", "crates/fs-hub", "crates/fs-hub-client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
fs-store = { path = "/srv/FreeSynergy/fs-store/crates/fs-store" }
fs-hub-proto = { path = "crates/fs-hub-proto" }
capnp = "0.23"
capnp-rpc = "0.23"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
